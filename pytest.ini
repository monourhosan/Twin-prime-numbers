[pytest]
pythonpath = .
testpaths = tests
markers =
    phase11_tier1: Tier 1 Feature Coverage tests
    phase11_tier2: Tier 2 Boundary & Corner Case tests
    phase11_tier3: Tier 3 Cross-Feature Combination tests
    phase11_tier4: Tier 4 End-to-End Real-World Workflow tests
    slow: Computationally intensive verification tests
filterwarnings =
    ignore::DeprecationWarning
