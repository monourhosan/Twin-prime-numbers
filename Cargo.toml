[package]
name = "cats-twin-prime"
version = "1.0.0"
edition = "2021"
authors = ["Antigravity Research Group"]
description = "Certificate-Aware Adaptive Twin-prime Sieve (CATS) Engine"

[dependencies]
num-bigint = { version = "0.4.8", features = ["serde"] }
num-traits = "0.2.19"
num-integer = "0.1.47"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
clap = { version = "4.5.31", features = ["derive"] }
sha2 = "0.10.8"
chrono = "0.4.40"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
